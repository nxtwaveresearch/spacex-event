  .bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-circle { position: absolute; top: -200px; right: -200px; width: 720px; height: 720px; border-radius: 50%; border: 1px solid rgba(91,155,213,0.07); background: radial-gradient(circle at 40% 40%, rgba(91,155,213,0.06) 0%, transparent 60%); }
  .bg-circle-2 { position: absolute; bottom: -140px; left: -140px; width: 520px; height: 520px; border-radius: 50%; border: 1px solid rgba(91,155,213,0.04); }

  .submit-btn { padding: 14px 26px; background: #5b9bd5; color: #0b1628; border: none; border-radius: 0 2px 2px 0; font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: background 0.15s; white-space: nowrap; }

  .cta-btn { padding: 16px 44px; background: #5b9bd5; color: #0b1628; border: none; border-radius: 2px; font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; transition: background 0.15s; }
  .cta-btn:hover { background: #89c0f0; }
  .cta-meta { font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(232,237,245,0.22); margin-top: 14px; }

  @keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
